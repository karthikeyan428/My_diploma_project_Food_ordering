<!DOCTYPE html>
<html>
<head>
  <title>QuickBite - Your Cart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    
    header.cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: linear-gradient(90deg, #ff9e3b, #ffc371);
      color: white;
    }
    .cart-title h1 { margin: 0; font-size: 28px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);}
    .cart-actions button {
      margin-left: 10px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      color: #ff7a18;
      transition: 0.3s;
    }
    .cart-actions button:hover { background: #ffb347; color: white; }
    #cart-items { max-width: 900px; margin: 30px auto; display: flex; flex-direction: column; gap: 20px; }
    .cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  border-radius: 18px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.15);
  transition: 0.3s ease;
}

.cart-item:hover {
  transform: translateY(-6px) scale(1.01);
}
    .cart-item:hover { transform: translateY(-2px); }
    .cart-item h3, .cart-item p { margin: 0; }
    .cart-right { max-width: 400px; margin: 30px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); text-align: center; }
    .cart-right h3 { margin-bottom: 15px; }
    .payment-box { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-bottom: 20px; }
    .payment-option { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; transition: 0.2s; }
    .payment-option.active, .payment-option:hover { border-color: #ff7a18; background: #fff3e0; }
  .summary-box {
  backdrop-filter: blur(15px);
  background: rgba(255, 255, 255, 0.75);
  border-radius: 20px;
  padding: 20px;
  color: #333;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  border: 1px solid rgba(255,122,24,0.2);
  transition: 0.3s;
}

.summary-box:hover {
  transform: scale(1.02);
}
    .summary-box h2 { margin-bottom: 15px; }
    .summary-buttons button { width: 45%; margin: 5px; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .invoice-btn { background: #4caf50; color: white; }
    .invoice-btn:hover { background: #45a049; }
    .order-btn { background: #ff7a18; color: white; }
    .order-btn:hover { background: #ff9e3b; }
    #empty-cart { text-align: center; margin-top: 50px; font-size: 20px; color: #555; }

    /* Toast Alert Box */
    #toastBox {
      display:none;
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 250px;
      background: #ff7a18;
      color: white;
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      font-weight: bold;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }
    #toastBox.show { opacity: 1; }

    /* Quantity and remove buttons as box */
    .cart-actions-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .cart-btn-box {
  padding: 8px 14px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg,#ff7a18,#ff9e3b);
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

.cart-btn-box:hover {
  transform: scale(1.15);
  box-shadow: 0 8px 20px rgba(255,122,24,0.4);
}

.cart-btn-box.remove {
  background: linear-gradient(135deg,#ff3c3c,#d00000);
}
    .cart-btn-box:hover { background: #ff9e3b; }
    .cart-btn-box.remove { background: red; }
    .main-cart {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 30px;
  max-width: 1200px;
  margin: 40px auto;
  padding: 20px;
}

@media(max-width:900px){
  .main-cart{
    grid-template-columns: 1fr;
  }
}

.cart-right, .summary-box {
  position: sticky;
  top: 100px;
}
@keyframes fadePage {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}
.cart-item {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  border-radius: 15px;
  padding: 15px;
  color: #333;
  box-shadow: 0 5px 15px rgba(0,0,0,0.06);
  animation: slideIn 0.5s ease forwards;
  opacity: 0;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.summary-box {
  animation: slideUp 0.7s ease;
}

@keyframes slideUp {
  from {
    transform: translateY(50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}#grandTotalValue {
  animation: glowPulse 1.5s infinite alternate;
}

@keyframes glowPulse {
  from {
    text-shadow: 0 0 5px rgba(255,122,24,0.4);
  }
  to {
    text-shadow: 0 0 20px rgba(255,122,24,0.9);
  }
}
button:active {
  transform: scale(0.9);
}

/* Floating Particles */
.particles {
  position: fixed;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: -1;
  top: 0;
  left: 0;
}

.particles span {
  position: absolute;
  display: block;
  width: 8px;
  height: 8px;
  background: rgba(255, 165, 0, 0.25);
  animation: floatUp 10s linear infinite;
  bottom: -50px;
  border-radius: 50%;
}

@keyframes floatUp {
  from {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  to {
    transform: translateY(-1000px) scale(0.5);
    opacity: 0;
  }
}
.spark {
  position: absolute;
  width: 6px;
  height: 6px;
  background: orange;
  border-radius: 50%;
  pointer-events: none;
  animation: sparkAnim 0.6s linear forwards;
}

@keyframes sparkAnim {
  from {
    opacity: 1;
    transform: translate(0,0) scale(1);
  }
  to {
    opacity: 0;
    transform: translate(var(--x), var(--y)) scale(0.5);
  }
}
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #fff8f2, #ffe9d6, #fff4e6);
  background-size: 200% 200%;
  animation: gradientMove 12s ease infinite;
  animation: fadePage 0.8s ease-in-out;
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: linear-gradient(135deg,#ff7a18,#ffb347);
  min-height: 100vh;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  background: red;
  top: -10px;
  animation: fall 3s linear forwards;
  z-index: 999;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}
/* ===== PRO COUPON SECTION ===== */

.coupon-container {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.coupon-input-box {
  position: relative;
  flex: 1;
}

.coupon-input-box input {
  width: 100%;
  padding: 12px 10px;
  border-radius: 10px;
  border: 2px solid rgba(255,122,24,0.3);
  outline: none;
  background: rgba(255,255,255,0.9);
  font-size: 14px;
  transition: 0.3s;
}

.coupon-input-box label {
  position: absolute;
  left: 12px;
  top: 12px;
  color: #999;
  font-size: 14px;
  pointer-events: none;
  transition: 0.3s;
  background: transparent;
}

.coupon-input-box input:focus + label,
.coupon-input-box input:not(:placeholder-shown) + label {
  top: -8px;
  left: 8px;
  font-size: 11px;
  color: #ff7a18;
  background: white;
  padding: 0 4px;
}

.focus-border {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 0%;
  height: 2px;
  background: linear-gradient(90deg,#ff7a18,#ffc371);
  transition: 0.4s;
}

.coupon-input-box input:focus ~ .focus-border {
  width: 100%;
  left: 0;
}

/* Apply Button */

.apply-btn {
  padding: 12px 18px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  color: white;
  background: linear-gradient(135deg,#ff7a18,#ffc371);
  transition: 0.3s;
}

.apply-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(255,122,24,0.3);
}
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}
.summary-box:hover {
  box-shadow: 0 15px 40px rgba(255,122,24,0.25);
}
#fireworks {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 999;
}
  </style>
</head>
<body>

<header class="cart-header">
  <div class="cart-title"><h1>🛒 Your Cart</h1></div>
  <div class="cart-actions">
    <button onclick="window.location='history.html'">📜 Order History</button>
    <button onclick="window.location='index.html'">🏠 Home</button>
  </div>
</header>

<div id="cart-items"></div>
<div id="empty-cart">Your cart is empty!</div>

<div class="cart-right">
  <h3>Select Payment Method</h3>
  <div class="payment-box">
    <label class="payment-option active"><input type="radio" name="payment" value="cash" checked> 💵 Cash on Delivery</label>
    <label class="payment-option"><input type="radio" name="payment" value="card"> 💳 Debit / Credit Card</label>
    <label class="payment-option"><input type="radio" name="payment" value="upi"> 📱 UPI</label>
  </div>
</div>
<div class="particles"></div>
<div class="summary-box">

  <!-- Coupon Box -->
  <div class="coupon-container">
  <div class="coupon-input-box">
    <input type="text" id="coupon" placeholder=" " required>
    <label>Enter Coupon Code</label>
    <span class="focus-border"></span>
  </div>
  <button class="apply-btn" onclick="applyCoupon()">Apply</button>
</div>

  <div id="total"></div>

  <div class="summary-buttons">
    <button class="invoice-btn" onclick="downloadInvoice()">Download Invoice</button>
    <button class="order-btn" onclick="proceedPayment()">Place Order</button>
  </div>

</div>

<!-- Toast Alert -->
<div id="toastBox"></div>
<canvas id="fireworks"></canvas>
<script>
function showToast(message, duration=2000){
  const box = document.getElementById("toastBox");
  box.innerText = message;
  box.style.display = "block";
  box.classList.add("show");
  setTimeout(()=>{
    box.classList.remove("show");
    setTimeout(()=>{ box.style.display="none"; }, 400);
  }, duration);
}

// Check login
const user = JSON.parse(localStorage.getItem('user'));
if(!user){
  showToast("Please login first!");
  setTimeout(()=>{ window.location.href="login.html"; }, 2000);
}

// Render Cart Items
function renderCart(){
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  

  // Make sure qty exists
  cart.forEach(item => { if(!item.qty) item.qty = 1; });
  localStorage.setItem("cart", JSON.stringify(cart));

  const cartContainer = document.getElementById("cart-items");
  const emptyCartMsg = document.getElementById("empty-cart");
  let subtotal = 0;

  cartContainer.innerHTML = "";

  // If cart empty
  if(cart.length === 0){
    emptyCartMsg.style.display = "block";
    document.getElementById("total").innerHTML = "Grand Total: ₹0";
    return;
  } else {
    emptyCartMsg.style.display = "none";
  }

  // Render items
  cart.forEach((item,index)=>{
    const div = document.createElement("div");
    div.className = "cart-item";

    div.innerHTML = `
      <div>
        <h3>${item.name}</h3>
        <p>Price: ₹${item.price}</p>
      </div>
      <div class="cart-actions-box">
        <button class="cart-btn-box" onclick="changeQty(${index},-1)">-</button>
        <span>${item.qty}</span>
        <button class="cart-btn-box" onclick="changeQty(${index},1)">+</button>
        <button class="cart-btn-box remove" onclick="removeItem(${index})">Remove</button>
        <p><strong>Total: ₹${item.price * item.qty}</strong></p>
      </div>
    `;

    cartContainer.appendChild(div);
    subtotal += item.price * item.qty;
  });

  // Extra charges
  let delivery = subtotal > 0 ? 40 : 0;
  let gst = subtotal * 0.05;

  // Discount (if coupon applied)
  let discount = localStorage.getItem("discount") ? subtotal * 0.1 : 0;

  // Final amount
  let grandTotal = subtotal + delivery + gst - discount;

  // Display summary
document.getElementById("total").innerHTML = `
  Subtotal: ₹${subtotal.toFixed(2)} <br>
  Delivery: ₹${delivery.toFixed(2)} <br>
  GST (5%): ₹${gst.toFixed(2)} <br>
  Discount: -₹${discount.toFixed(2)} <br><br>
  <strong id="grandTotalValue">Grand Total: ₹0.00</strong>
`;

// Animate only Grand Total
animateTotal(grandTotal);

function animateTotal(finalAmount) {
  let start = 0;
  let duration = 800;
  let startTime = null;

  function updateAnimation(currentTime) {
    if (!startTime) startTime = currentTime;
    let progress = currentTime - startTime;
    let percentage = Math.min(progress / duration, 1);

    let currentValue = start + (finalAmount - start) * percentage;

    document.getElementById("grandTotalValue").innerText =
      "Grand Total: ₹" + currentValue.toFixed(2);

    if (percentage < 1) {
      requestAnimationFrame(updateAnimation);
    }
  }

  requestAnimationFrame(updateAnimation);
}
}
// Change Quantity
function changeQty(index, delta){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart[index].qty += delta;
  if(cart[index].qty <= 0){
    if(confirm("Quantity is 0. Remove item?")) cart.splice(index,1);
    else cart[index].qty=1;
  }
  localStorage.setItem("cart", JSON.stringify(cart));
  document.body.style.transition = "0.2s";
document.body.style.transform = "scale(0.995)";
setTimeout(()=>{
  document.body.style.transform = "scale(1)";
},150);

  renderCart();
}

// Remove Item
function removeItem(index){
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  const itemName = cart[index].name;

  const confirmBox = document.createElement("div");
  confirmBox.style.cssText = `
    position: fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#fff; padding:25px; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.3);
    z-index:9999; text-align:center; font-family:'Segoe UI',sans-serif;
  `;
  confirmBox.innerHTML = `
    <p style="margin-bottom:20px; font-weight:bold;">Remove <span style="color:#ff7a18;">${itemName}</span> from cart?</p>
    <button id="yesBtn" style="margin-right:10px;padding:8px 16px;background:#ff7a18;color:white;border:none;border-radius:8px;cursor:pointer;">Yes</button>
    <button id="noBtn" style="padding:8px 16px;background:#ccc;color:#333;border:none;border-radius:8px;cursor:pointer;">No</button>
  `;
  document.body.appendChild(confirmBox);

  document.getElementById("yesBtn").onclick = () => {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    showToast("Item removed!");
    renderCart();
    document.body.removeChild(confirmBox);
  };
  document.getElementById("noBtn").onclick = () => {
    document.body.removeChild(confirmBox);
  };
}

// Payment
function proceedPayment(){
  let selected = document.querySelector('input[name="payment"]:checked');
  if(!selected){ showToast("Select a payment method!"); return; }
  localStorage.setItem('selectedPaymentMethod', selected.value);
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  if(cart.length===0){ showToast("Cart is empty!"); return; }

  const total = cart.reduce((sum,item)=>sum+item.price*item.qty,0);
  const pendingOrder = {items:cart,total:total,date:new Date().toLocaleString()};
  localStorage.setItem('pendingOrder',JSON.stringify(pendingOrder));

  if(selected.value==='card'||selected.value==='upi'){ window.location.href="payment.html"; }
  else{

  // 🔥 Generate Order ID
  let counter = localStorage.getItem("orderCounter") || 0;
  counter++;
  localStorage.setItem("orderCounter", counter);

  let year = new Date().getFullYear();
  let padded = String(counter).padStart(4, '0');
  let orderId = `QB-${year}-${padded}`;

  // 🔥 Calculate FINAL GRAND TOTAL (same logic as renderCart)
  let subtotal = cart.reduce((sum,item)=>sum+item.price*item.qty,0);
  let delivery = subtotal > 0 ? 40 : 0;
  let gst = subtotal * 0.05;
  let discount = localStorage.getItem("discount") ? subtotal * 0.1 : 0;
  let grandTotal = subtotal + delivery + gst - discount;

  // 🔥 Create Proper Order Object
  let newOrder = {
    id: orderId,
    items: cart,
    total: grandTotal,
    payment: "Cash on Delivery",
    status: "Pending",
    date: new Date().toISOString()
  };

  const history = JSON.parse(localStorage.getItem("orderHistory")) || [];
  history.push(newOrder);
  localStorage.setItem("orderHistory", JSON.stringify(history));

  localStorage.removeItem("cart");
  localStorage.removeItem("discount");

  showToast("Cash Order Placed Successfully 💵🔥",1500);

  setTimeout(()=>{
    window.location.href="success.html";
  },1500);
}
}

// Download Invoice
function downloadInvoice(){
  const order = JSON.parse(localStorage.getItem("cart")) || [];
  if(order.length===0){ showToast("Cart is empty!"); return; }
  let invoice = "QuickBite Invoice\n\n";
  let total=0;
  order.forEach(item => { invoice+=`${item.name} x${item.qty} = ₹${item.price*item.qty}\n`; total+=item.price*item.qty; });
  invoice += `\nGrand Total: ₹${total}`;
  const blob = new Blob([invoice], {type:"text/plain"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `Invoice_${new Date().getTime()}.txt`;
  link.click();
}
function applyCoupon(){
  const code = document.getElementById("coupon").value.trim();
  const box = document.querySelector(".coupon-input-box input");

  if(code === "QB10"){
    localStorage.setItem("discount", true);
    showToast("Coupon Applied! 10% Discount 🎉");
    renderCart();

    // Success animation
    box.style.borderColor = "#4caf50";
    box.style.boxShadow = "0 0 15px rgba(76,175,80,0.6)";
    createSparks();
    pulseSummary();

    setTimeout(()=>{
      box.style.borderColor = "rgba(255,122,24,0.3)";
      box.style.boxShadow = "none";
    },1500);

  } else {
    shakeInput(box);
    showToast("Invalid Coupon ❌");
  }
}
// Highlight selected payment option
window.addEventListener('DOMContentLoaded', renderCart);
document.querySelectorAll('.payment-option input').forEach(input => {
  input.addEventListener('change', function() {
    document.querySelectorAll('.payment-option').forEach(label => label.classList.remove('active'));
    this.parentElement.classList.add('active');
  });
});

const particleContainer = document.querySelector(".particles");

for (let i = 0; i < 30; i++) {
  let particle = document.createElement("span");
  particle.style.left = Math.random() * 100 + "vw";
  particle.style.animationDuration = (5 + Math.random() * 5) + "s";
  particle.style.width = particle.style.height = 
      (5 + Math.random() * 10) + "px";
  particleContainer.appendChild(particle);
}
function createSparks() {
  const button = document.querySelector(".summary-box button");

  for (let i = 0; i < 20; i++) {
    let spark = document.createElement("div");
    spark.className = "spark";

    let x = (Math.random() - 0.5) * 200 + "px";
    let y = (Math.random() - 0.5) * 200 + "px";

    spark.style.setProperty("--x", x);
    spark.style.setProperty("--y", y);

    spark.style.left = button.offsetLeft + button.offsetWidth / 2 + "px";
    spark.style.top = button.offsetTop + button.offsetHeight / 2 + "px";

    document.body.appendChild(spark);

    setTimeout(() => spark.remove(), 600);
  }
}
function launchConfetti() {
  for (let i = 0; i < 100; i++) {
    let confetti = document.createElement("div");
    confetti.className = "confetti";

    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.backgroundColor = 
      "hsl(" + Math.random() * 360 + ", 100%, 50%)";

    confetti.style.animationDuration = 
      (2 + Math.random() * 2) + "s";

    document.body.appendChild(confetti);

    setTimeout(() => confetti.remove(), 3000);
  }
}
function shakeInput(element){
  element.style.animation = "shake 0.4s";
  setTimeout(()=>{ element.style.animation=""; },400);
}

function pulseSummary(){
  const summary = document.querySelector(".summary-box");
  summary.style.animation = "pulse 0.6s";
  setTimeout(()=>{ summary.style.animation="slideUp 0.7s"; },600);
}
function launchFireworks() {
  const container = document.getElementById("fireworks");

  const fireworks = new Fireworks.default(container, {
    rocketsPoint: 50,
    hue: { min: 0, max: 360 },
    delay: { min: 15, max: 30 },
    speed: 3,
    acceleration: 1.05,
    friction: 0.95,
    gravity: 1.5,
    particles: 60,
    trace: 3,
    explosion: 5,
    autoresize: true,
    brightness: { min: 50, max: 80 }
  });

  fireworks.start();

  setTimeout(() => {
    fireworks.stop();
  }, 4000);
}

function placeOrder() {
  launchFireworks();
}
createSparks();

</script>

</body>
</html>
