<!DOCTYPE html>
<html>
<head>
<title>QuickBite - Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background: linear-gradient(-45deg,#ff5200,#ff7a18,#ff3c00,#ff8c42);
  background-size:400% 400%;
  animation: gradientMove 10s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.feedback-container{
  width:420px;
  padding:35px;
  border-radius:25px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.15);
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  color:white;
  animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

h2{
  text-align:center;
  margin-bottom:20px;
}

/* ⭐ Star Rating */
.stars{
  display:flex;
  justify-content:center;
  gap:10px;
  font-size:30px;
  cursor:pointer;
  margin-bottom:20px;
}

.star{
  transition:0.3s;
}

.star.active{
  color:gold;
  transform:scale(1.3);
  text-shadow:0 0 10px gold;
}

/* Emoji Mood */
.emoji-box{
  display:flex;
  justify-content:space-around;
  margin-bottom:20px;
  font-size:28px;
  cursor:pointer;
}

.emoji{
  transition:0.3s;
}

.emoji.selected{
  transform:scale(1.4);
  filter:drop-shadow(0 0 10px white);
}

/* Input */
textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  resize:none;
  font-family:'Poppins';
}

textarea:focus{
  box-shadow:0 0 12px rgba(255,255,255,0.5);
}

/* Submit Button */
.submit-btn{
  width:100%;
  padding:12px;
  margin-top:20px;
  border:none;
  border-radius:30px;
  font-weight:bold;
  background:white;
  color:#ff5200;
  cursor:pointer;
  transition:0.3s;
}

.submit-btn:hover{
  transform:scale(1.05);
}

.submit-btn.loading{
  color:transparent;
  position:relative;
  pointer-events:none;
}

.submit-btn.loading::after{
  content:"";
  width:20px;
  height:20px;
  border:3px solid #ff5200;
  border-top:3px solid transparent;
  border-radius:50%;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  animation:spin 0.8s linear infinite;
}

@keyframes spin{
  to{transform:translate(-50%,-50%) rotate(360deg);}
}

.submit-btn.success{
  background:#28a745 !important;
  color:white !important;
  box-shadow:0 0 20px rgba(0,255,136,0.7);
}

/* Success Overlay */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:28px;
  flex-direction:column;
  animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

.success-circle{
  width:120px;
  height:120px;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  color:#28a745;
  margin-bottom:20px;
  animation:pop 0.6s ease;
}

@keyframes pop{
  from{transform:scale(0);}
  to{transform:scale(1);}
}
/* ===============================
   🚨 CUSTOM ALERT POPUP
================================ */

.custom-alert{
  position:fixed;
  top:30px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:rgba(0,0,0,0.85);
  color:white;
  padding:14px 25px;
  border-radius:30px;
  font-weight:600;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
  opacity:0;
  z-index:9999;
  animation:alertSlide 0.4s ease forwards;
}

@keyframes alertSlide{
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
}

.custom-alert.hide{
  animation:alertHide 0.4s ease forwards;
}

@keyframes alertHide{
  to{
    opacity:0;
    transform:translateX(-50%) translateY(-20px);
  }
}
</style>
</head>
<body>

<div class="feedback-container">
  <h2>⭐ Rate Your Experience</h2>

  <div class="stars">
    <span class="star" onclick="rate(1)">★</span>
    <span class="star" onclick="rate(2)">★</span>
    <span class="star" onclick="rate(3)">★</span>
    <span class="star" onclick="rate(4)">★</span>
    <span class="star" onclick="rate(5)">★</span>
  </div>

  <div class="emoji-box">
    <span class="emoji" onclick="selectEmoji(this)">😡</span>
    <span class="emoji" onclick="selectEmoji(this)">😐</span>
    <span class="emoji" onclick="selectEmoji(this)">😊</span>
    <span class="emoji" onclick="selectEmoji(this)">😍</span>
  </div>

  <textarea id="comment" rows="4" placeholder="Write your feedback..."></textarea>

  <button class="submit-btn" onclick="submitFeedback()">Submit Feedback</button>
</div>

<script>
let rating = 0;
let mood = "";

function rate(value){
  rating = value;
  document.querySelectorAll(".star").forEach((s,i)=>{
    s.classList.toggle("active", i < value);
  });
}

function selectEmoji(el){
  mood = el.innerText;
  document.querySelectorAll(".emoji").forEach(e=>e.classList.remove("selected"));
  el.classList.add("selected");
}

function submitFeedback(){
  const comment = document.getElementById("comment").value;
  const btn = document.querySelector(".submit-btn");

  if(rating === 0){
    showAlert("⭐ Please select a rating first!");
    return;
  }

  btn.classList.add("loading");

  setTimeout(()=>{

    btn.classList.remove("loading");
    btn.classList.add("success");
    btn.innerHTML="✔ Submitted";

    const feedback = {
      rating,
      mood,
      comment,
      date:new Date()
    };

    const all = JSON.parse(localStorage.getItem("feedbacks"))||[];
    all.push(feedback);
    localStorage.setItem("feedbacks",JSON.stringify(all));

    showSuccessOverlay();

  },2000);
}

function showSuccessOverlay(){
  const overlay = document.createElement("div");
  overlay.className="overlay";
  overlay.innerHTML=`
    <div class="success-circle">✔</div>
    Thank you for your feedback!
  `;

  document.body.appendChild(overlay);

  setTimeout(()=>{
    window.location.href="index.html";
  },2500);
}
function showAlert(message){
  const alertBox = document.createElement("div");
  alertBox.className = "custom-alert";
  alertBox.innerText = message;

  document.body.appendChild(alertBox);

  setTimeout(()=>{
    alertBox.classList.add("hide");
    setTimeout(()=> alertBox.remove(),400);
  },2000);
}
</script>

</body>
</html>
