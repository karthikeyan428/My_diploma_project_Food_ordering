<!DOCTYPE html>
<html>
<head>
  <title>Order History</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:linear-gradient(135deg,#ff7a18,#ffb347,#ff9966);
  background-size:300% 300%;
  animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

    header.main-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 40px;
      background:linear-gradient(90deg,#ff7a18,#ffb347);
      color:white;
    }

    header.main-header button{
      background:red;
      padding:8px 14px;
      border:none;
      border-radius:6px;
      color:white;
      cursor:pointer;
    }

    .history-container{
      max-width:900px;
      margin:40px auto;
    }

    .order-card{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(15px);
  padding:20px;
  border-radius:16px;
  box-shadow:0 15px 35px rgba(0,0,0,0.15);
  margin-bottom:25px;
  transition:0.4s;
  animation:fadeUp 0.6s ease forwards;
  opacity:0;
}

.order-card:hover{
  transform:translateY(-6px) scale(1.02);
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px)}
  to{opacity:1; transform:translateY(0)}
}

    .order-top{
      display:flex;
      justify-content:space-between;
      margin-bottom:10px;
    }

    .badge{
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
      font-weight:bold;
    }

    .order-id{
      background:#333;
      color:white;
    }

    .payment-badge{
      background:#28a745;
      color:white;
    }

    .order-items{
      margin:10px 0;
      line-height:1.6;
    }

    .order-total{
      font-weight:bold;
      font-size:18px;
    }

    .download-btn{
      margin-top:10px;
      padding:8px 14px;
      border:none;
      border-radius:6px;
      background:#ff7a18;
      color:white;
      cursor:pointer;
    }

    /* Modal Styles */
    .modal{
      display:none;
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      justify-content:center;
      align-items:center;
      z-index:1000;
    }

    .modal-box{
      background:white;
      padding:30px;
      border-radius:12px;
      max-width:400px;
      text-align:center;
    }

    .modal-buttons button{
      margin:10px;
      padding:8px 14px;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    .cancel-btn{background:#ccc;}
    .confirm-btn{background:red; color:white;}
    .status-badge{
  background:#ffc107;
  color:#000;
}

.status-paid{
  background:#28a745;
  color:white;
}

.status-delivered{
  background:#007bff;
  color:white;
}
  </style>
</head>
<body>

<header class="main-header">
   <div class="header-left">
    <h1>📜 Order History</h1>
   </div>
  <div class="header-right">
    <button onclick="window.location='index.html'" class="home-btn">🏠 Home</button>
    <button onclick="goToCart()" class="cart-btn">
      🛒 Cart <span class="cart-badge" id="cart-count">0</span>
    </button>
    <button onclick="openModal()" class="clear-btn">Clear History</button>
  </div>
</header>

<div style="max-width:900px;margin:20px auto;display:flex;gap:10px;">
  <input type="text" id="searchOrder" placeholder="Search Order ID..." 
    style="flex:1;padding:10px;border-radius:8px;border:none;">
     <select id="filterPayment" style="padding:10px;border-radius:8px;border:none;">
    <option value="">All Payments</option>
    <option value="Cash on Delivery">Cash</option>
    <option value="Card">Card</option>
    <option value="UPI">UPI</option>
  </select>
</div>


<div class="history-container" id="history-container"></div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
  <div class="modal-box">
    <h2>⚠ Delete Order History</h2>
    <p>This will permanently remove all your orders.</p>
    <p><strong>This action cannot be undone.</strong></p>
    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="confirm-btn" onclick="confirmClearHistory()">Delete</button>
    </div>
  </div>
</div>

<script>
function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").innerText = cart.length;
}

function goToCart(){
  window.location.href = "cart.html";
}

// Modal functions
function openModal(){ document.getElementById("deleteModal").style.display = "flex"; }
function closeModal(){ document.getElementById("deleteModal").style.display = "none"; }
function confirmClearHistory(){
  localStorage.removeItem("orderHistory");
  loadHistory();
  closeModal();
}

// Load Order History
function loadHistory(){
  const container = document.getElementById("history-container");
  const history = JSON.parse(localStorage.getItem("orderHistory")) || [];
  const searchValue = document.getElementById("searchOrder")?.value?.toLowerCase() || "";
  const filterValue = document.getElementById("filterPayment")?.value || "";

  container.innerHTML = '';

  if(history.length === 0){
    container.innerHTML = '<p style="text-align:center;color:white;">No orders yet.</p>';
    return;
  }

  history.forEach((order, index)=>{

    if(searchValue && !order.id?.toLowerCase().includes(searchValue)) return;
    if(filterValue && order.payment !== filterValue) return;

    let itemsList = '';
    order.items.forEach(item=>{
      itemsList += `${item.name} x${item.qty} - ₹${item.price*item.qty}<br>`;
    });

    let statusClass = "status-badge";
    if(order.payment === "Card" || order.payment === "UPI"){
      statusClass = "status-paid";
    }

    container.innerHTML += `
      <div class="order-card">
        <div class="order-top">
          <span class="badge order-id">${order.id || "QB-XXXX"}</span>
          <span class="badge payment-badge">${order.payment}</span>
          <span class="badge ${statusClass}">${order.status || "Pending"}</span>
        </div>
        <div class="order-items">${itemsList}</div>
        <div class="order-total">Total: ₹${order.total}</div>
        <button class="download-btn" onclick="downloadInvoicePDF(${index})">
          Download PDF Invoice
        </button>
      </div>
    `;
  });
}

// Download PDF Invoice Function using jsPDF (Professional)
function downloadInvoicePDF(index){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const history = JSON.parse(localStorage.getItem("orderHistory")) || [];
  const order = history[index];
  if(!order) return;

  const logoSrc = "logo.png"; // your logo path
  const img = new Image();
  img.src = logoSrc;

  img.onload = ()=>{
    // Add logo if exists
    doc.addImage(img, 'PNG', 15, 10, 40, 20);

    // Header
    doc.setFontSize(18);
    doc.setTextColor("#ff7a18");
    doc.text("QuickBite Invoice", 70, 20);

    // Order Info
    doc.setFontSize(12);
    doc.setTextColor("#000");
    doc.text(`Order #: ${index+1}`, 15, 40);
    doc.text(`Date: ${order.date}`, 15, 48);
    doc.text(`Payment: ${order.payment}`, 15, 56);

    // Table Header
    doc.setFillColor("#ff7a18");
    doc.setTextColor("#fff");
    doc.rect(15, 62, 180, 8, 'F'); // header background
    doc.text("Item", 18, 68);
    doc.text("Qty", 120, 68);
    doc.text("Price", 150, 68);

    let y = 72;
    doc.setTextColor("#000");

    order.items.forEach(item=>{
      doc.text(item.name, 18, y);
      doc.text(item.qty.toString(), 120, y);
      doc.text(`₹${item.price*item.qty}`, 150, y);
      y += 8;
    });

    // Total
    doc.setFontSize(14);
    doc.setTextColor("#28a745");
    doc.text(`Total: ₹${order.total}`, 15, y+8);

    doc.setFontSize(12);
    doc.setTextColor("#000");
    doc.text("Thank you for ordering from QuickBite! 🍔", 15, y+16);

    doc.save(`Invoice_${order.id || index+1}.pdf`);
  };

  img.onerror = ()=>{
    // Logo not found, generate PDF without logo
    console.warn("Logo not found. Generating PDF without logo.");

    // Header
    doc.setFontSize(18);
    doc.setTextColor("#ff7a18");
    doc.text("QuickBite Invoice", 15, 20);

    // Order Info
    doc.setFontSize(12);
    doc.setTextColor("#000");
    doc.text(`Order #: ${index+1}`, 15, 40);
    doc.text(`Date: ${order.date}`, 15, 48);
    doc.text(`Payment: ${order.payment}`, 15, 56);

    // Table Header
    doc.setFillColor("#ff7a18");
    doc.setTextColor("#fff");
    doc.rect(15, 62, 180, 8, 'F'); // header background
    doc.text("Item", 18, 68);
    doc.text("Qty", 120, 68);
    doc.text("Price", 150, 68);

    let y = 72;
    doc.setTextColor("#000");

    order.items.forEach(item=>{
      doc.text(item.name, 18, y);
      doc.text(item.qty.toString(), 120, y);
      doc.text(`₹${item.price*item.qty}`, 150, y);
      y += 8;
    });

    // Total
    doc.setFontSize(14);
    doc.setTextColor("#28a745");
    doc.text(`Total: ₹${order.total}`, 15, y+8);

    doc.setFontSize(12);
    doc.setTextColor("#000");
    doc.text("Thank you for ordering from QuickBite! 🍔", 15, y+16);

    doc.save(`Invoice_Order_${index+1}.pdf`);
  };
}

// Initialize
loadHistory();
updateCartCount();
document.getElementById("searchOrder").addEventListener("input", loadHistory);
document.getElementById("filterPayment").addEventListener("change", loadHistory);
</script>

</body>
</html>
