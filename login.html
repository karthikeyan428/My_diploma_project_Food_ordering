<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuickBite - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(-45deg,#ff7a18,#ffb347,#ff3c00,#ff8c00);
  background-size:400% 400%;
  animation:gradientMove 8s ease infinite;
}

@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.login-container{
  width:380px;
  padding:45px 35px;
  border-radius:20px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.15);
  box-shadow:0 8px 32px rgba(0,0,0,0.25);
  color:#fff;
  text-align:center;
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.login-container h2{
  margin-bottom:30px;
  font-weight:700;
  letter-spacing:1px;
}

.input-group{
  position:relative;
  margin-bottom:25px;
}

.input-group input{
  width:100%;
  padding:14px;
  border:none;
  outline:none;
  border-radius:10px;
  background:rgba(255,255,255,0.25);
  color:#fff;
  font-size:15px;
}

.input-group label{
  position:absolute;
  left:15px;
  top:14px;
  color:#eee;
  font-size:14px;
  pointer-events:none;
  transition:0.3s;
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label{
  top:-10px;
  left:10px;
  font-size:12px;
  background:#ff7a18;
  padding:2px 6px;
  border-radius:5px;
}

.password-toggle{
  position:absolute;
  right:12px;
  top:14px;
  cursor:pointer;
  font-size:14px;
}

.login-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  background:#fff;
  color:#ff7a18;
  font-size:16px;
  transition:0.3s;
}

.login-btn:hover{
  transform:scale(1.05);
  background:#ffe0c2;
}

.back-btn{
  margin-top:15px;
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
  font-size:14px;
}

.error-message{
  margin-top:15px;
  color:#ffdddd;
  display:none;
  font-size:14px;
}

.shake{
  animation:shake 0.4s;
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}

</style>
</head>

<body>

<div class="login-container" id="loginBox">
  <h2>🍔 QuickBite Login</h2>

  <div class="input-group">
    <input type="text" id="username" placeholder=" " required>
    <label>Username</label>
  </div>

  <div class="input-group">
    <input type="password" id="password" placeholder=" " required>
    <label>Password</label>
    <span class="password-toggle" onclick="togglePassword()">👁</span>
  </div>

  <button class="login-btn" onclick="login()">Login</button>
  <button class="back-btn" onclick="window.location='index.html'">Back</button>

  <p class="error-message" id="error-msg">Invalid username or password</p>
</div>

<script>

function togglePassword(){
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

function login(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorMsg = document.getElementById("error-msg");
  const box = document.getElementById("loginBox");

  if(!username || !password){
    errorMsg.textContent="Please enter both username and password!";
    errorMsg.style.display="block";
    box.classList.add("shake");
    setTimeout(()=>box.classList.remove("shake"),400);
    return;
  }

  // Save user
  localStorage.setItem("user", JSON.stringify({username}));

  // Smooth redirect
  document.body.style.opacity="0";
  setTimeout(()=>{
    window.location.href="index.html";
  },500);
}

// Login on Enter key
document.addEventListener("keypress",function(e){
  if(e.key==="Enter"){
    login();
  }
});

</script>

</body>
</html>
