<!DOCTYPE html>
<html>
<head>
<title>QuickBite - Payment</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background: linear-gradient(-45deg,#ff5200,#ff7a18,#ff3c00,#ff8c42);
  background-size:400% 400%;
  animation: gradientMove 10s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.payment-container{
  width:420px;
  padding:35px;
  border-radius:25px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.15);
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  color:white;
  animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

.payment-container h2{
  text-align:center;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:14px;
}

.pay-btn{
  width:100%;
  padding:12px;
  margin-top:25px;
  border:none;
  border-radius:30px;
  font-weight:bold;
  background:white;
  color:#ff5200;
  cursor:pointer;
  transition:0.3s;
}

.pay-btn:hover{
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(255,255,255,0.4);
}

.upi-logos{
  display:flex;
  justify-content:space-around;
  margin-top:15px;
}

.upi-logos img{
  width:60px;
  height:60px;
  border-radius:15px;
  padding:5px;
  cursor:pointer;
  background:white;
  transition:0.3s;
}

.upi-logos img:hover{
  transform:scale(1.1);
}

#qr-image{
  display:none;
  width:220px;
  margin:15px auto;
  border-radius:12px;
}

.loader{
  display:none;
  margin-top:20px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
}


@keyframes pop{
  from{transform:scale(0);}
  to{transform:scale(1);}
}

.alert{
  display:none;
  margin-top:15px;
  padding:10px;
  border-radius:10px;
  background:#ff4c4c;
  text-align:center;
}
/* Smooth input focus glow */
.payment-container input:focus{
  outline:none;
  border:1px solid #ff7a18;
  box-shadow:0 0 8px rgba(255,122,24,0.4);
  transition:0.3s;
}
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}


@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
/* Fireworks canvas */
#fireworksCanvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10000;
}

/* Extra glow animation */
.success-circle{
  box-shadow:0 0 25px rgba(0,255,136,0.8),
             0 0 60px rgba(0,255,136,0.6);
  animation:pop 0.6s ease, pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}
/* Morph Button Animation */
.pay-btn.loading {
  background: white;
  color: transparent;
  position: relative;
  pointer-events: none;
}

.pay-btn.loading::after {
  content: "";
  width: 22px;
  height: 22px;
  border: 3px solid #ff5200;
  border-top: 3px solid transparent;
  border-radius: 50%;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  animation: spin 0.8s linear infinite;
}

@keyframes zoomBlast {
  0% { transform: scale(0.8); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.pay-btn.success{
  background: #28a745 !important;
  color: white !important;
  box-shadow: 0 0 20px rgba(40,167,69,0.7),
              0 0 40px rgba(40,167,69,0.5);
  transition: all 0.4s ease;
}
/* ==============================
   💚 FULL SCREEN SUCCESS
============================== */

#successOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:20000;
  animation:fadeIn 0.4s ease;
}

.success-wrapper{
  text-align:center;
  color:white;
  animation:zoomIn 0.5s ease forwards;
}

.success-circle-big{
  width:150px;
  height:150px;
  background:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  box-shadow:0 0 40px rgba(0,255,136,0.8);
}

.big-check{
  width:70px;
  height:70px;
  stroke:#28a745;
  stroke-width:3;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:50;
  stroke-dashoffset:50;
  animation:drawCheck 0.6s ease forwards;
}

@keyframes drawCheck{
  to{ stroke-dashoffset:0; }
}

@keyframes zoomIn{
  from{ transform:scale(0.6); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes spin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}
</style>
</head>
<body>

<div class="payment-container">
  <h2>💳 Secure Payment</h2>

  <div id="cardDetails" style="display:none;">
    <input type="text" id="cardNumber" placeholder="Card Number">
    <input type="text" id="cardHolder" placeholder="Card Holder Name">
    <input type="text" id="expiry" placeholder="Expiry Date (MM/YY)">
    <input type="text" id="cvv" placeholder="CVV">
  </div>

  <div id="upiDetails" style="display:none;">
    <p>Select UPI App</p>
    <div class="upi-logos">
      <img src="/image/gpay.png" onclick="selectUPI('gpay')">
      <img src="/image/phonepe.png" onclick="selectUPI('phonepe')">
      <img src="/image/paytm.jpg" onclick="selectUPI('paytm')">
    </div>

    <input type="text" id="upiId" placeholder="Enter UPI ID">

    <button class="pay-btn" onclick="showQR()">Scan QR</button>
    <img id="qr-image" src="/image/upi-qr.jpeg">
  </div>

  <div id="alertBox" class="alert"></div>
  <div id="loader" class="loader"></div>

  <button id="payButton" class="pay-btn" onclick="processPayment()">Pay Now</button>
</div>
<!-- Premium Success Overlay -->
<div id="successOverlay" style="display:none;">
  <div class="success-wrapper">
    <div class="success-circle-big">
      <svg viewBox="0 0 24 24" class="big-check">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h2>Payment Successful!</h2>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user'));
if(!user){
  alert("Please login first!");
  window.location.href="login.html";
}

window.addEventListener('DOMContentLoaded',()=>{
  const method = localStorage.getItem("selectedPaymentMethod");

  if(method==="card"){
    cardDetails.style.display="block";
  }else if(method==="upi"){
    upiDetails.style.display="block";
  }else if(method==="cash"){

  loader.style.display="block";
  loader.innerHTML="Placing Cash on Delivery Order...";

  setTimeout(()=>{

    processOrder("Cash on Delivery");  // 👈 THIS LINE FIXES IT

    window.location.href="success.html";

  },1500);
}
});

function showAlert(msg){
  const box=document.getElementById("alertBox");
  box.innerText=msg;
  box.style.display="block";
  setTimeout(()=>box.style.display="none",3000);
}

function selectUPI(app){
  document.getElementById("upiId").value=app+"@upi";
}

function showQR(){
  const qr = document.getElementById("qr-image");
  const button = document.getElementById("payButton");
  const loader = document.getElementById("loader");

  qr.style.display = "block";
  button.style.display = "block";

button.classList.add("loading");
button.innerHTML = "";
button.disabled = true;

  loader.style.display = "block";
  loader.innerHTML = "Processing UPI Payment...";

setTimeout(()=>{

  button.classList.remove("loading");
  loader.style.display = "none";

  processOrder("UPI");

  showBigSuccess();

},10000);
}
function processPayment(){

  const method = localStorage.getItem("selectedPaymentMethod");
  const button = document.getElementById("payButton");

  // 🔄 Start loading animation
  button.classList.add("loading");
  button.disabled = true;

  setTimeout(()=>{

    // ⛔ Stop loading
    button.classList.remove("loading");

    // Process order
    processOrder(method);

    // Show your big success overlay
    showBigSuccess();

  },2500); // 2.5 seconds loading
}

function processOrder(method){

  const order = JSON.parse(localStorage.getItem("pendingOrder"));

  if(order){

    order.id = generateOrderId();        // 👈 ADD THIS
    order.payment = method;
    order.status = "Pending";            // 👈 ADD THIS
    order.date = new Date().toISOString();  // 👈 ADD THIS

    const history = JSON.parse(localStorage.getItem("orderHistory")) || [];

    history.push(order);

    localStorage.setItem("orderHistory", JSON.stringify(history));

    localStorage.removeItem("pendingOrder");
    localStorage.removeItem("cart");
    localStorage.removeItem("selectedPaymentMethod");
  }
}
// 💳 Card Auto Format (xxxx xxxx xxxx xxxx)
document.getElementById("cardNumber")?.addEventListener("input", function(e){
  let value = e.target.value.replace(/\D/g,"");
  value = value.substring(0,16);
  value = value.replace(/(.{4})/g,"$1 ").trim();
  e.target.value = value;
});

// 📅 Expiry Auto Format (MM/YY)
document.getElementById("expiry")?.addEventListener("input", function(e){
  let value = e.target.value.replace(/\D/g,"");
  if(value.length > 4) value = value.substring(0,4);
  if(value.length >= 3){
    value = value.substring(0,2) + "/" + value.substring(2);
  }
  e.target.value = value;
});

// 🔢 CVV Only 3 digits
document.getElementById("cvv")?.addEventListener("input", function(e){
  e.target.value = e.target.value.replace(/\D/g,"").substring(0,3);
});

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,index)=>{
      p.x += Math.cos(p.angle)*p.speed;
      p.y += Math.sin(p.angle)*p.speed;
      p.alpha -= 0.01;

      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();

      if(p.alpha <= 0){
        particles.splice(index,1);
      }
    });

    requestAnimationFrame(update);
  }

  // Launch fireworks repeatedly
  setInterval(createFirework,800);

function generateOrderId(){

  let counter = localStorage.getItem("orderCounter") || 0;
  counter++;
  localStorage.setItem("orderCounter", counter);

  let year = new Date().getFullYear();
  let padded = String(counter).padStart(4, '0');

  return `QB-${year}-${padded}`;
}

history.push(newOrder);

localStorage.setItem("orderHistory", JSON.stringify(history));
function showBigSuccess(){

  const overlay = document.getElementById("successOverlay");
  overlay.style.display = "flex";

  setTimeout(()=>{
    window.location.href = "success.html";
  },2500);
}

  update();

</script>

</body>
</html>
